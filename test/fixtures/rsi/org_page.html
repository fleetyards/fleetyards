<!DOCTYPE html>
<html lang="en">
<head><title>Test Squadron - Organization - Roberts Space Industries</title></head>
<body>
  <div id="organization">
    <div class="inner">
      <div class="heading">
        <h1>Test Squadron / <span class="symbol">TEST</span></h1>
        <ul class="tags clearfix">
          <li class="model">Organization</li>
          <li class="commitment">Casual</li>
        </ul>
        <ul class="focus clearfix">
          <li class="primary tooltip-wrap">
            <img src="/media/icon/Social.png" alt="Social" />
            <div class="rsi-tooltip"><div class="content">Social</div></div>
          </li>
          <li class="secondary tooltip-wrap">
            <img src="/media/icon/Security.png" alt="Security" />
            <div class="rsi-tooltip"><div class="content">Security</div></div>
          </li>
        </ul>
      </div>
      <div class="content join-us clearfix">
        <div class="body markitup-text">
          <p>Welcome to the squadron. %{intro}</p>
        </div>
      </div>
      <div class="content-tab-wrapper">
        <div class="content-tab active">
          <h2 class="tab-title">History</h2>
          <div class="markitup-text"><p>Founded a while ago.</p></div>
        </div>
        <div class="content-tab">
          <h2 class="tab-title">Manifesto</h2>
          <div class="markitup-text"><p>Fly together. %{manifesto}</p></div>
        </div>
        <div class="content-tab">
          <h2 class="tab-title">Charter</h2>
          <div class="markitup-text"><p>Be excellent.</p></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
