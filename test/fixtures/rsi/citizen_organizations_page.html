<!DOCTYPE html>
<html lang="en">
<head><title>Test Pilot | TestPilot - Organizations - Roberts Space Industries</title></head>
<body>
  <div id="public-profile">
    <div class="profile-content orgs-content clearfix">
      <div class="box-content org main visibility-V">
        <div class="inner-bg clearfix">
          <div class="title">Main organization </div>
          <div class="left-col">
            <div class="inner clearfix">
              <div class="info">
                <p class="entry">
                  <a href="/orgs/%{main}" class="value">Main Squadron</a>
                </p>
                <p class="entry">
                  <span class="label">Spectrum Identification (SID)</span>
                  <strong class="value">%{main}</strong>
                </p>
                <p class="entry">
                  <span class="label">Organization rank</span>
                  <strong class="value">Pilot</strong>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="box-content org affiliation  visibility-V ">
        <div class="inner-bg clearfix">
          <div class="title">Affiliation </div>
          <div class="left-col">
            <div class="inner clearfix">
              <div class="info">
                <p class="entry orgtitle">
                  <a href="/orgs/%{affiliation}" class="value data4">Affiliated Wing</a>
                </p>
                <p class="entry">
                  <span class="label data10">Spectrum Identification (SID)</span>
                  <strong class="value data14">%{affiliation}</strong>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="box-content org affiliation  visibility-R ">
        <div class="inner-bg clearfix">
          <div class="title">Affiliation </div>
          <div class="left-col">
            <div class="inner clearfix">
              <div class="info">
                <p class="entry">
                  <span class="label">Spectrum Identification (SID)</span>
                  <strong class="value">%{redacted}</strong>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
