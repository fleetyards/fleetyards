name: CDN Upload Job

on:
  workflow_call:
    inputs:
      tag:
        description: "Docker image tag to extract assets from"
        required: true
        type: string
      destination:
        description: "Deployment destination (live, stage)"
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/workflows/bunny-storage-action
        with:
          destination: ${{ inputs.destination }}
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract assets from Docker image
        run: |
          docker pull ghcr.io/fleetyards/app:${{ inputs.tag }}
          CID=$(docker create ghcr.io/fleetyards/app:${{ inputs.tag }})
          docker cp "${CID}:/rails/public/vite" ./vite-assets
          docker rm "${CID}"
          echo "Extracted $(find ./vite-assets -type f | wc -l) asset files"

      - name: Upload assets to Bunny Storage
        run: bin/cdn-assets upload vite-assets "${{ inputs.tag }}"
