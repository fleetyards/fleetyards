---
de:
  notifications:
    hangar_create:
      title: "%{model} zum Hangar hinzugefügt"
    hangar_destroy:
      title: "%{model} aus dem Hangar entfernt"
    wishlist_create:
      title: "%{model} zur Wunschliste hinzugefügt"
    wishlist_destroy:
      title: "%{model} von der Wunschliste entfernt"
    model_on_sale:
      title: "%{model} ist im Angebot"
      body: "%{model} ist derzeit im Pledge-Store erhältlich."
    hangar_sync_finished:
      title: Hangar-Synchronisierung abgeschlossen
      body: Ihr RSI-Hangar wurde erfolgreich synchronisiert.
      warnings: Warnungen
      more_items: "und %{count} weitere"
      summary:
        imported_vehicles: Schiffe hinzugefügt
        found_vehicles: Schiffe gefunden
        moved_vehicles_to_wanted: Schiffe zur Wunschliste verschoben
        deleted_vehicles: Gelöschte Schiffe
        grouped_vehicles: In eine Gruppe einsortierte Schiffe
        unchanged_vehicles: Unverändert gelassene Schiffe
        imported_components: Komponenten hinzugefügt
        found_components: Komponenten gefunden
        imported_upgrades: Upgrades hinzugefügt
        found_upgrades: Upgrades gefunden
        missing_models: Schiffe nicht gefunden
        missing_components: Komponenten nicht gefunden
        missing_component_vehicles: Kein passendes Schiff für Komponenten
        missing_upgrades: Upgrades nicht gefunden
        missing_upgrade_vehicles: Kein passendes Schiff für Upgrades
    hangar_sync_failed:
      title: Hangar-Synchronisierung fehlgeschlagen
      body: 'Ihre RSI-Hangar-Synchronisierung ist fehlgeschlagen: %{error}'
    new_model:
      title: 'Neues Schiff: %{model}'
      body: "%{model} wurde zur Schiffsdatenbank hinzugefügt."
    inventory_transfer_received:
      title: "%{sender} hat dir %{count} Gegenstände gesendet"
      title_fleet: "%{sender} hat %{fleet} %{count} Gegenstände gesendet"
    inventory_transfer_resolved:
      title: "Dein Transfer an %{recipient} wurde %{outcome}"
    fleet_invite:
      title: Sie wurden zu %{fleet} eingeladen
    fleet_member_requested:
      title: "%{username} hat eine Beitrittsanfrage für %{fleet} gestellt"
    fleet_subscription_started:
      title: "%{fleet} hat jetzt die Flotten-Funktionen"
    fleet_subscription_ended:
      title: "%{fleet} hat die Flotten-Funktionen verloren — %{reason}"
      reasons:
        contribution: "die unterstützende Spende ist nicht mehr aktiv"
        manual: "die Freigabe wurde von einem Administrator beendet"
    fleet_rsi_verification_lost:
      title: "%{fleet} ist nicht mehr für %{sid} verifiziert"
      body: "Eine andere Flotte hat ihren Verifizierungscode auf die RSI-Seite der Organisation %{sid} gesetzt und damit gezeigt, dass sie sie verwaltet. Deine Flotte zeigt die SID nicht mehr als verifiziert. Wenn %{sid} deine Organisation ist, verifiziere sie in den Flotteneinstellungen erneut."
    fleet_fid_claim_opened:
      title: "%{claimant} beansprucht die Flotten-ID %{fid}"
      body: "%{claimant} hat nachgewiesen, dass sie die RSI-Organisation **%{fid}** führt, und darf deshalb die passende Flotten-ID übernehmen.\n\n**Am %{date}:**\n\n- %{fleet} bekommt die nächste freie Flotten-ID, etwa **%{fid}-1**.\n- Links auf %{fid} öffnen ab dann %{claimant}.\n\n**Um die ID zu behalten**, verifiziere %{fid} vorher in den Flotteneinstellungen. Andernfalls sag deinen Mitgliedern Bescheid, dass sich die Adresse ändert."
    fleet_fid_claim_completed:
      claimant:
        title: "%{fleet} hat jetzt die Flotten-ID %{fid}"
        body: "Die Schonfrist ist vorbei, und die Flotten-ID %{fid} gehört euch. Links auf %{fid} öffnen jetzt deine Flotte."
      holder:
        title: "%{fleet} heißt jetzt %{new_fid}"
        body: "Die Flotten-ID %{fid} ist an %{claimant} gegangen, die für die RSI-Organisation %{fid} verifiziert ist. ID und Adresse deiner Flotte lauten jetzt %{new_fid}, und alte Links auf %{fid} öffnen %{claimant}."
    fleet_fid_claim_cancelled:
      holder_withdrawn:
        title: "Der Anspruch auf %{fid} wurde zurückgezogen"
        body: "%{claimant} hat ihren Anspruch zurückgezogen, %{fleet} behält also die Flotten-ID %{fid}."
      holder_holder_verified:
        title: "%{fleet} behält die Flotten-ID %{fid}"
        body: "Deine Flotte ist jetzt für die RSI-Organisation %{fid} verifiziert, deshalb ist der Anspruch von %{claimant} beendet."
      holder_claimant_unverified:
        title: "Der Anspruch auf %{fid} ist beendet"
        body: "%{claimant} ist nicht mehr für die RSI-Organisation %{fid} verifiziert, %{fleet} behält also die Flotten-ID."
      holder_admin:
        title: "Der Anspruch auf %{fid} wurde abgebrochen"
        body: "Ein Administrator hat den Anspruch von %{claimant} abgebrochen, %{fleet} behält also die Flotten-ID %{fid}."
      claimant_holder_verified:
        title: "Dein Anspruch auf %{fid} ist beendet"
        body: "%{holder} hat nachgewiesen, dass sie die RSI-Organisation %{fid} führt. %{fleet} ist deshalb nicht mehr dafür verifiziert, und der Anspruch ist beendet."
      claimant_claimant_unverified:
        title: "Dein Anspruch auf %{fid} ist beendet"
        body: "%{fleet} ist nicht mehr für die RSI-Organisation %{fid} verifiziert, deshalb ist der Anspruch beendet."
      claimant_admin:
        title: "Dein Anspruch auf %{fid} wurde abgebrochen"
        body: "Ein Administrator hat den Anspruch von %{fleet} auf die Flotten-ID %{fid} abgebrochen."
    fleet_member_accepted:
      title: "%{username} ist %{fleet} beigetreten"
    fleet_request_accepted:
      title: Sie wurden in %{fleet} aufgenommen
    friend_request_received:
      title: "%{username} hat dir eine Freundschaftsanfrage geschickt"
    friend_request_accepted:
      title: "%{username} hat deine Freundschaftsanfrage angenommen"
    fleet_ally_request_received:
      title: "%{fleet} möchte sich mit %{own_fleet} verbünden"
    fleet_ally_request_accepted:
      title: "%{fleet} ist jetzt mit %{own_fleet} verbündet"
    tour_join_request_received:
      title: "%{username} möchte bei %{tour} mitmachen"
    tour_join_request_accepted:
      title: "Du bist bei %{tour} dabei"
    payout_ledger_settled:
      title: "Die Auszahlung für %{subject} steht fest"
    payout_entry_pending_review:
      title: "%{user} hat eine Ausgabe für %{subject} eingereicht"
    payout_entry_declined:
      title: "Deine Ausgabe \"%{description}\" für %{subject} wurde abgelehnt"
    fleet_contract:
      published:
        title: "Neuer Auftrag in %{fleet}: %{title}"
        body: "%{fleet} hat einen neuen Auftrag ausgeschrieben."
      claimed:
        title: "%{user} hat %{title} übernommen"
      fulfilled:
        title: "%{title} wurde erfüllt"
      settled:
        title: "Die Auszahlung für %{title} steht fest"
      crew_requested:
        title: "%{user} möchte bei %{title} mitmachen"
      crew_accepted:
        title: "Du wurdest zur Crew von %{title} hinzugefügt"
      crew_declined:
        title: "Deine Anfrage für %{title} wurde abgelehnt"
    fleet_inventory_item_added:
      title: "Neuer Gegenstand im Inventar von %{fleet}: %{item_name}"
    fleet_event:
      published:
        title: "Neues Event in %{fleet}: %{title}"
        body: "%{fleet} hat ein neues Event veröffentlicht."
      locked:
        title: "Anmeldungen für %{title} geschlossen"
      starting_soon:
        title: "%{title} beginnt bald"
      started:
        title: "%{title} hat begonnen"
      completed:
        title: "%{title} wurde abgeschlossen"
      cancelled:
        title: "%{title} wurde abgesagt"
    fleet_event_signup:
      added:
        title: "%{user} hat sich für %{title} angemeldet"
      withdrawn:
        title: "%{user} hat sich von %{title} abgemeldet"
      confirmed:
        title: "Deine Anmeldung für %{title} wurde bestätigt"
      assigned:
        title: "Du wurdest für %{title} als %{slot} eingeteilt"
      kicked:
        title: "Du wurdest aus %{title} entfernt"
