name: Build Job

on:
  workflow_call:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Install 1Password CLI
        run: |
          curl -sSfo /tmp/op.zip "https://cache.agilebits.com/dist/1P/op2/pkg/v2.33.0/op_linux_amd64_v2.33.0.zip"
          unzip -o /tmp/op.zip -d /usr/local/bin op
          chmod +x /usr/local/bin/op

      - name: Fetch Rails master key
        id: secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          RAILS_MASTER_KEY=$(op read "op://Fleetyards/RAILS_MASTER_KEY_LIVE/credential")
          echo "::add-mask::$RAILS_MASTER_KEY"
          echo "rails_master_key=$RAILS_MASTER_KEY" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fleetyards/app
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=${{ github.sha }}

      - name: Read Ruby version from .tool-versions
        id: ruby
        run: echo "version=$(grep '^ruby ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Mirror Service Images keeps this copy fresh; this only covers a Ruby
      # bump released before that workflow has run.
      - name: Ensure Ruby base image is mirrored
        env:
          IMAGE: ruby:${{ steps.ruby.outputs.version }}-slim
        run: |
          if docker buildx imagetools inspect "ghcr.io/fleetyards/$IMAGE" > /dev/null 2>&1; then
            exit 0
          fi
          for attempt in 1 2 3; do
            for source in "public.ecr.aws/docker/library/$IMAGE" "docker.io/library/$IMAGE"; do
              if docker buildx imagetools create --tag "ghcr.io/fleetyards/$IMAGE" "$source"; then
                exit 0
              fi
            done
            sleep $((attempt * 60))
          done
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            service=fleetyards
          build-args: |
            RUBY_VERSION=${{ steps.ruby.outputs.version }}
            BASE_IMAGE_REGISTRY=ghcr.io/fleetyards
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            RAILS_MASTER_KEY=${{ steps.secrets.outputs.rails_master_key }}
