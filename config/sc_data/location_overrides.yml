# A generic base under the star, named for no place and referenced by nothing;
# every real one is keyed and tagged after its planet.
AsteroidCluster_MiningBase_Stanton:
  skip: true

# The export ships the Nyx star with an empty description, so nothing names
# its class; the star is F-type in the published lore. The class is what the
# star is coloured by.
NyxStar:
  description: An F-type main sequence star.

# Pyro V is a gas giant; its description only mentions "a striking
# atmosphere swirled with shades of green and yellow".
Pyro5:
  body_type: gas_giant

# Buildings cover most of ArcCorp, which the description says without naming
# it a city planet.
Stanton3:
  body_type: city

# The game files carry no spaceport names. Teasa and August Dunlow appear in
# the localisation only as destination labels.
Stanton1_Lorville_Spaceport:
  name: Teasa Spaceport
Stanton2_Orison_Spaceport:
  name: August Dunlow Spaceport
Stanton3_Area18_Spaceport:
  name: Riker Memorial Spaceport
Stanton4_NewBabbage_Spaceport:
  name: New Babbage Interstellar Spaceport
