<% web_ips = `bash .kamal/server-ips web stage`.strip.split(',') %>
<% acc_ips = `bash .kamal/server-ips accessory stage`.strip.split(',') %>

# Kamal destination: stage (staging)
# Deploy with: kamal deploy -d stage

servers:
  web:
    hosts:
<%= web_ips.map { |ip| "      - #{ip}" }.join("\n") %>
    options:
      memory: 2g
  worker:
    hosts:
<%= web_ips.map { |ip| "      - #{ip}" }.join("\n") %>
    options:
      memory: 1g
  discord_bot:
    hosts:
      - <%= ENV.fetch("KAMAL_DISCORD_BOT_HOST", web_ips.first) %>

builder:
  args:
    RAILS_ENV: staging
    CDN_ENDPOINT: "https://cdn.fltyrd.dev"

proxy:
  ssl: true
  hosts:
    - fleetyards.dev
    - www.fleetyards.dev
    - api.fleetyards.dev
    - admin.fleetyards.dev
    - docs.fleetyards.dev
    - fltyrd.dev

env:
  clear:
    RAILS_ENV: staging
    WORKER_COUNT: "1"
    MAX_THREADS: "3"
    MIN_THREADS: "3"
    DOMAIN: fleetyards.dev
    SHORT_DOMAIN: fltyrd.dev
    CDN_ENDPOINT: "https://cdn.fltyrd.dev"
    STORAGE_CDN_ENDPOINT: "https://storage.fltyrd.dev"
    MAILER_DEFAULT_FROM: "info@fleetyards.dev"
    CABLE_ENDPOINT: "wss://fleetyards.dev/cable"
    # Uploads are written to both stores while they move to Bunny; this one is
    # read from. Flipping it to bunny is the switch, flipping back the rollback.
    STORAGE_PRIMARY: hetzner
    BUNNY_S3__ENDPOINT: https://de-s3.storage.bunnycdn.com
    BUNNY_S3__BUCKET: fltyrd-stage-uploads
    BUNNY_S3__REGION: de

accessories:
  db:
    host: <%= acc_ips.first %>
    options:
      memory: 2g
  redis:
    host: <%= acc_ips.first %>
    options:
      memory: 1g
  db-backup:
    host: <%= acc_ips.first %>
    env:
      clear:
        POSTGRES_DATABASE: fleetyards_staging
        S3_BUCKET: fltyrd-stage-backups
