---
fr:
  notifications:
    hangar_create:
      title: "%{model} ajouté au hangar"
    hangar_destroy:
      title: "%{model} retiré du hangar"
    wishlist_create:
      title: "%{model} ajouté à la liste de souhaits"
    wishlist_destroy:
      title: "%{model} retiré de la liste de souhaits"
    model_on_sale:
      title: "%{model} est en vente"
      body: "%{model} est actuellement en vente dans le magasin de pledge."
    hangar_sync_finished:
      title: Synchronisation du hangar terminée
      body: Votre hangar RSI a été synchronisé avec succès.
      warnings: Avertissements
      more_items: "et %{count} de plus"
      summary:
        imported_vehicles: Vaisseaux ajoutés
        found_vehicles: Vaisseaux trouvés
        moved_vehicles_to_wanted: Vaisseaux déplacés vers la liste de souhaits
        deleted_vehicles: Vaisseaux supprimés
        grouped_vehicles: Vaisseaux classés dans un groupe
        unchanged_vehicles: Vaisseaux laissés inchangés
        imported_components: Composants ajoutés
        found_components: Composants trouvés
        imported_upgrades: Améliorations ajoutées
        found_upgrades: Améliorations trouvées
        missing_models: Vaisseaux introuvables
        missing_components: Composants introuvables
        missing_component_vehicles: Aucun vaisseau correspondant pour les composants
        missing_upgrades: Améliorations introuvables
        missing_upgrade_vehicles: Aucun vaisseau correspondant pour les améliorations
    hangar_sync_failed:
      title: Échec de la synchronisation du hangar
      body: 'La synchronisation de votre hangar RSI a échoué : %{error}'
    new_model:
      title: 'Nouveau vaisseau : %{model}'
      body: "%{model} a été ajouté à la base de données des vaisseaux."
    inventory_transfer_received:
      title: "%{sender} vous a envoyé %{count} objet(s)"
      title_fleet: "%{sender} a envoyé %{count} objet(s) à %{fleet}"
    inventory_transfer_resolved:
      title: "Votre transfert vers %{recipient} a été %{outcome}"
    fleet_invite:
      title: Vous avez été invité à %{fleet}
    fleet_member_requested:
      title: "%{username} a demandé à rejoindre %{fleet}"
    fleet_subscription_started:
      title: "%{fleet} dispose désormais des fonctionnalités de flotte"
    fleet_subscription_ended:
      title: "%{fleet} a perdu les fonctionnalités de flotte — %{reason}"
      reasons:
        contribution: "le don qui la soutenait n'est plus actif"
        manual: "l'octroi a été clôturé par un administrateur"
    fleet_rsi_verification_lost:
      title: "%{fleet} n’est plus vérifiée pour %{sid}"
      body: "Une autre flotte a prouvé qu’elle gère l’organisation RSI %{sid} en plaçant son code de vérification sur la page de l’organisation. Ta flotte n’affiche plus le SID comme vérifié. Si %{sid} est ton organisation, vérifie-la à nouveau depuis les paramètres de la flotte."
    fleet_fid_claim_opened:
      title: "%{claimant} réclame l’ID de flotte %{fid}"
      body: "%{claimant} a prouvé qu’elle gère l’organisation RSI **%{fid}** et peut donc prendre l’ID de flotte correspondant.\n\n**Le %{date} :**\n\n- %{fleet} passe au prochain ID de flotte libre, comme **%{fid}-1**.\n- Les liens vers %{fid} ouvriront ensuite %{claimant}.\n\n**Pour garder l’ID**, vérifie %{fid} avant cette date dans les paramètres de la flotte. Sinon, préviens tes membres du changement d’adresse."
    fleet_fid_claim_completed:
      claimant:
        title: "%{fleet} a maintenant l’ID de flotte %{fid}"
        body: "Le délai de grâce est terminé et l’ID de flotte %{fid} est à vous. Les liens vers %{fid} ouvrent maintenant ta flotte."
      holder:
        title: "%{fleet} s’appelle maintenant %{new_fid}"
        body: "L’ID de flotte %{fid} est passé à %{claimant}, vérifiée pour l’organisation RSI %{fid}. L’ID et l’adresse de ta flotte sont maintenant %{new_fid}, et les anciens liens vers %{fid} ouvrent %{claimant}."
    fleet_fid_claim_cancelled:
      holder_withdrawn:
        title: "La réclamation de %{fid} a été retirée"
        body: "%{claimant} a retiré sa réclamation, %{fleet} garde donc l’ID de flotte %{fid}."
      holder_holder_verified:
        title: "%{fleet} garde l’ID de flotte %{fid}"
        body: "Ta flotte est maintenant vérifiée pour l’organisation RSI %{fid}, la réclamation de %{claimant} est donc terminée."
      holder_claimant_unverified:
        title: "La réclamation de %{fid} est terminée"
        body: "%{claimant} n’est plus vérifiée pour l’organisation RSI %{fid}, %{fleet} garde donc l’ID de flotte."
      holder_admin:
        title: "La réclamation de %{fid} a été annulée"
        body: "Un administrateur a annulé la réclamation de %{claimant}, %{fleet} garde donc l’ID de flotte %{fid}."
      claimant_holder_verified:
        title: "Ta réclamation de %{fid} est terminée"
        body: "%{holder} a prouvé qu’elle gère l’organisation RSI %{fid} : %{fleet} n’est donc plus vérifiée pour elle et la réclamation est terminée."
      claimant_claimant_unverified:
        title: "Ta réclamation de %{fid} est terminée"
        body: "%{fleet} n’est plus vérifiée pour l’organisation RSI %{fid}, la réclamation est donc terminée."
      claimant_admin:
        title: "Ta réclamation de %{fid} a été annulée"
        body: "Un administrateur a annulé la réclamation de %{fleet} sur l’ID de flotte %{fid}."
    rsi_handle_verification_lost:
      title: "Ton pseudo RSI %{handle} n’est plus vérifié"
      body: "Un autre compte Fleetyards a prouvé que le pseudo RSI %{handle} lui appartient, via Citizen iD ou avec son code de vérification dans la bio RSI. Ton profil n’affiche plus le pseudo comme vérifié. Si %{handle} est le tien, vérifie-le à nouveau depuis les paramètres de ton profil."
    fleet_member_accepted:
      title: "%{username} a rejoint %{fleet}"
    fleet_request_accepted:
      title: Vous avez été accepté dans %{fleet}
    friend_request_received:
      title: "%{username} vous a envoyé une demande d'ami"
    friend_request_accepted:
      title: "%{username} a accepté votre demande d'ami"
    fleet_ally_request_received:
      title: "%{fleet} souhaite s'allier avec %{own_fleet}"
    fleet_ally_request_accepted:
      title: "%{fleet} est désormais alliée à %{own_fleet}"
    tour_join_request_received:
      title: "%{username} veut rejoindre %{tour}"
    tour_join_request_accepted:
      title: "Vous participez à %{tour}"
    payout_ledger_settled:
      title: "Les paiements de %{subject} sont arrêtés"
    payout_entry_pending_review:
      title: "%{user} a soumis une dépense sur %{subject}"
    payout_entry_declined:
      title: "Votre dépense \"%{description}\" sur %{subject} a été refusée"
    fleet_contract:
      published:
        title: "Nouveau contrat dans %{fleet} : %{title}"
        body: "%{fleet} vient de publier un nouveau contrat."
      claimed:
        title: "%{user} a pris %{title}"
      fulfilled:
        title: "%{title} a été rempli"
      settled:
        title: "Le paiement de %{title} est arrêté"
      crew_requested:
        title: "%{user} a demandé à rejoindre %{title}"
      crew_accepted:
        title: "Vous avez été ajouté à l'équipage de %{title}"
      crew_declined:
        title: "Votre demande pour rejoindre %{title} a été refusée"
    fleet_inventory_item_added:
      title: "Nouvel objet dans l'inventaire de %{fleet} : %{item_name}"
    fleet_event:
      published:
        title: "Nouvel événement dans %{fleet} : %{title}"
        body: "%{fleet} vient de publier un nouvel événement."
      locked:
        title: "Inscriptions closes pour %{title}"
      starting_soon:
        title: "%{title} commence bientôt"
      started:
        title: "%{title} a commencé"
      completed:
        title: "%{title} est terminé"
      cancelled:
        title: "%{title} a été annulé"
    fleet_event_signup:
      added:
        title: "%{user} s'est inscrit à %{title}"
      withdrawn:
        title: "%{user} s'est désinscrit de %{title}"
      confirmed:
        title: "Votre inscription à %{title} a été approuvée"
      assigned:
        title: "Vous avez été affecté à %{slot} pour %{title}"
      kicked:
        title: "Vous avez été retiré de %{title}"
