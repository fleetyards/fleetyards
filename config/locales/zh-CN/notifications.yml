---
zh-CN:
  notifications:
    hangar_create:
      title: "%{model} 已添加到机库"
    hangar_destroy:
      title: "%{model} 已从机库移除"
    wishlist_create:
      title: "%{model} 已添加到愿望清单"
    wishlist_destroy:
      title: "%{model} 已从愿望清单移除"
    model_on_sale:
      title: "%{model} 正在出售"
      body: "%{model} 目前在质押商店中出售。"
    hangar_sync_finished:
      title: 机库同步完成
      body: 您的 RSI 机库已成功同步。
      warnings: 警告
      more_items: "以及另外 %{count} 项"
      summary:
        imported_vehicles: 已添加的飞船
        found_vehicles: 已找到的飞船
        moved_vehicles_to_wanted: 已移至愿望清单的飞船
        deleted_vehicles: 已删除的飞船
        grouped_vehicles: 已归入分组的飞船
        unchanged_vehicles: 保持不变的飞船
        imported_components: 已添加的组件
        found_components: 已找到的组件
        imported_upgrades: 已添加的升级
        found_upgrades: 已找到的升级
        synced_paints: 已同步涂装
        synced_hangar_flair: 已同步机库装饰
        missing_models: 未找到的飞船
        missing_components: 未找到的组件
        missing_component_vehicles: 没有与组件匹配的飞船
        missing_upgrades: 未找到的升级
        missing_upgrade_vehicles: 没有与升级匹配的飞船
    hangar_sync_failed:
      title: 机库同步失败
      body: '您的 RSI 机库同步失败: %{error}'
    new_model:
      title: '新飞船: %{model}'
      body: "%{model} 已添加到飞船数据库。"
    inventory_transfer_received:
      title: "%{sender} 向你发送了 %{count} 件物品"
      title_fleet: "%{sender} 向 %{fleet} 发送了 %{count} 件物品"
    inventory_transfer_resolved:
      title: "你发往 %{recipient} 的转移已%{outcome}"
    fleet_invite:
      title: 您已被邀请加入 %{fleet}
    fleet_member_requested:
      title: "%{username} 请求加入 %{fleet}"
    fleet_subscription_started:
      title: "%{fleet} 现已获得舰队功能"
    fleet_subscription_ended:
      title: "%{fleet} 已失去舰队功能 — %{reason}"
      reasons:
        contribution: "支持该舰队的捐赠已不再有效"
        manual: "管理员已结束该授权"
    fleet_rsi_verification_lost:
      title: "%{fleet} 不再是 %{sid} 的已验证舰队"
      body: "另一支舰队将其验证码放到了 RSI 组织 %{sid} 的页面上，证明它在管理该组织。你的舰队不再将该 SID 显示为已验证。如果 %{sid} 是你的组织，请在舰队设置中重新验证。"
    fleet_fid_claim_opened:
      title: "%{claimant} 申领舰队 ID %{fid}"
      body: "%{claimant} 已证明它在管理 RSI 组织 **%{fid}**，因此可以取得对应的舰队 ID。\n\n**%{date}：**\n\n- %{fleet} 将改用下一个空闲舰队 ID，例如 **%{fid}-1**。\n- 此后指向 %{fid} 的链接会打开 %{claimant}。\n\n**如需保留该 ID**，请在此之前到舰队设置中验证 %{fid}；否则请通知你的成员地址即将变更。"
    fleet_fid_claim_completed:
      claimant:
        title: "%{fleet} 现在拥有舰队 ID %{fid}"
        body: "宽限期已结束，舰队 ID %{fid} 归你们所有。指向 %{fid} 的链接现在会打开你的舰队。"
      holder:
        title: "%{fleet} 现在是 %{new_fid}"
        body: "舰队 ID %{fid} 已转给 %{claimant}，它已通过 RSI 组织 %{fid} 的验证。你的舰队 ID 和地址现在是 %{new_fid}，指向 %{fid} 的旧链接会打开 %{claimant}。"
    fleet_fid_claim_cancelled:
      holder_withdrawn:
        title: "对 %{fid} 的申领已撤回"
        body: "%{claimant} 撤回了申领，%{fleet} 保留舰队 ID %{fid}。"
      holder_holder_verified:
        title: "%{fleet} 保留舰队 ID %{fid}"
        body: "你的舰队现已通过 RSI 组织 %{fid} 的验证，%{claimant} 的申领因此结束。"
      holder_claimant_unverified:
        title: "对 %{fid} 的申领已结束"
        body: "%{claimant} 不再是 RSI 组织 %{fid} 的已验证舰队，%{fleet} 保留该舰队 ID。"
      holder_admin:
        title: "对 %{fid} 的申领已取消"
        body: "管理员取消了 %{claimant} 的申领，%{fleet} 保留舰队 ID %{fid}。"
      claimant_holder_verified:
        title: "你对 %{fid} 的申领已结束"
        body: "%{holder} 已证明它在管理 RSI 组织 %{fid}，因此 %{fleet} 不再是该组织的已验证舰队，申领已结束。"
      claimant_claimant_unverified:
        title: "你对 %{fid} 的申领已结束"
        body: "%{fleet} 不再是 RSI 组织 %{fid} 的已验证舰队，申领已结束。"
      claimant_admin:
        title: "你对 %{fid} 的申领已取消"
        body: "管理员取消了 %{fleet} 对舰队 ID %{fid} 的申领。"
    rsi_handle_verification_lost:
      title: "你的 RSI 用户名 %{handle} 不再是已验证状态"
      body: "另一个 Fleetyards 账户通过 Citizen iD 或将其验证码放入 RSI 个人简介，证明了 RSI 用户名 %{handle} 属于它。你的个人资料不再将该用户名显示为已验证。如果 %{handle} 是你的，请在个人资料设置中重新验证。"
    fleet_member_accepted:
