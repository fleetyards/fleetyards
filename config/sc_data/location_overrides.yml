# Corrections for starmap records the game export ships wrong, keyed by the
# record's key -- the part of `StarMapObject.<key>` after the dot, with dashes
# read as underscores, which is how the XML is parsed: `RR_NYX-CASTRA_JP1_CLINIC`
# is `RR_NYX_CASTRA_JP1_CLINIC` here.
#
# `name:` replaces the resolved name. `description:` fills a description the
# export leaves empty. `body_type:` says what kind of world a planet or moon is
# where its description does not name it. `skip: true` drops the record and
# everything under it. `merge:` folds the listed records into this one: they
# are copies of one place under one parent, and the location keeps this key.
#
# Only for names that are plainly wrong. A record the export names nothing at
# all stays skipped -- there is nothing here to say what it is called.
#
# A city's spaceport has no record: the parser makes one, keyed after the city
# with `_Spaceport` on the end, and `name:` is the only key it reads for it.
#
# Delete an entry once CIG fixes the record upstream.
---
# The default clinic name, never changed when the clinic was copied to the
# other gateways. Their gateway tells them apart.
RR_NYX_CASTRA_JP1_CLINIC:
  name: Clinic
RR_NYX_PYRO_JP1_CLINIC:
  name: Clinic
RR_STAN_MAGNUS_JP1_CLINIC:
  name: Clinic

# A hidden copy at the Stanton-Pyro jump point. INS Jericho is
