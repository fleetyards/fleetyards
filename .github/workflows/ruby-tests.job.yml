name: Ruby Tests Job

on:
  workflow_call:
    secrets:
      # Reads the object-storage keys for the parsed sc_data tree. Secrets are
      # not inherited by a called workflow, so main.yml passes this one through.
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

jobs:
  ruby-tests:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: root
      DB_PASSWORD: root
      REDIS_URL: redis://localhost:6379
      # Must be present before Rails boots — the short_routes block is gated
      # on `Rails.configuration.app.short_domain.present?` in
      # config/routes.rb, which is evaluated when `bin/rails test`
      # initializes routes (before test/test_helper.rb runs its own ENV
      # defaults). Without this, /c/:short_code falls through to the
      # frontend wildcard and the Vite-rendered layout crashes CI.
      SHORT_DOMAIN: fltyrd.test

    services:
      postgres:
        image: postgres:13.2-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_DB: fleetyards_test
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2.15-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build email assets
        run: bin/build-email-assets
      - run: mkdir -p log
      - name: Prepare test database
        run: bundle exec rake db:create db:schema:load

      # The loader tests are contract tests over the real export -- they assert
      # counts like `Equipment.count >= 4_000` and index specific items by key --
      # so they need the parsed tree, which is no longer in the repository.
      - name: Install 1Password CLI
        run: |
          curl -sSfo /tmp/op.zip "https://cache.agilebits.com/dist/1P/op2/pkg/v2.33.0/op_linux_amd64_v2.33.0.zip"
          unzip -o /tmp/op.zip -d /usr/local/bin op
          chmod +x /usr/local/bin/op

      # Every configured source, not just one: the cached tree holds all of them,
      # so the key has to move when any version does.
      - name: Read the sc_data sources
        id: sc-data
        run: |
          ruby -ryaml -e '
            shared = YAML.load_file("config/app/sc_data.yml").fetch("shared")
            sources = shared.fetch("sources")
            puts "key=#{sources.map { |environment, version| "#{environment}-#{version}" }.join("_")}"
            puts "default=#{shared.fetch("default", sources.keys.first)}"
          ' >> "$GITHUB_OUTPUT"

      # Keyed on the builds, so the download happens once per version bump rather
      # than once per run. Bump the `v1` prefix to force a refetch -- re-parsing
      # the same dump can change the tree without moving the version.
      - name: Cache the parsed sc_data tree
        id: parsed-tree
        uses: actions/cache@v6
        with:
          path: data/sc_data/parsed
          key: ${{ runner.os }}-sc-data-parsed-v1-${{ steps.sc-data.outputs.key }}

      - name: Fetch the parsed sc_data tree
        if: steps.parsed-tree.outputs.cache-hit != 'true'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SC_DATA_S3__ENDPOINT: https://fsn1.your-objectstorage.com
        run: |
          SC_DATA_S3__ACCESS_KEY_ID=$(op read "op://Fleetyards/HETZNER_S3/access_key_id")
          SC_DATA_S3__SECRET_ACCESS_KEY=$(op read "op://Fleetyards/HETZNER_S3/secret_access_key")
          echo "::add-mask::$SC_DATA_S3__ACCESS_KEY_ID"
          echo "::add-mask::$SC_DATA_S3__SECRET_ACCESS_KEY"
          export SC_DATA_S3__ACCESS_KEY_ID SC_DATA_S3__SECRET_ACCESS_KEY
          # The default source, read off the config rather than named here, so
          # renaming or adding an environment does not leave this behind.
          bin/scdata pull ${{ steps.sc-data.outputs.default }}

      - name: Run Minitest
        run: bin/rails test
