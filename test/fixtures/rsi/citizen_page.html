<!DOCTYPE html>
<html lang="en">
<head><title>Test Pilot | %{handle} - Roberts Space Industries</title></head>
<body>
  <div id="public-profile">
    <div class="profile-content overview-content clearfix">
      <p class="entry citizen-record">
        <span class="label">UEE Citizen Record</span>
        <strong class="value">#123456</strong>
      </p>
      <div class="box-content profile-wrapper clearfix">
        <div class="inner-bg clearfix">
          <div class="profile left-col">
            <span class="title">Profile </span>
            <div class="inner clearfix">
              <div class="info">
                <p class="entry">
                  <strong class="value">Test Pilot</strong>
                </p>
                <p class="entry">
                  <span class="label">Handle name</span>
                  <strong class="value">%{handle}</strong>
                </p>
              </div>
            </div>
          </div>
          <div class="main-org right-col visibility-V">
            <span class="title">Main organization </span>
            <div class="inner clearfix">
              <div class="info">
                <p class="entry">
                  <a href="/orgs/TEST" class="value data15">%{org_name}</a>
                </p>
                <p class="entry">
                  <span class="label data6">Spectrum Identification (SID)</span>
                  <strong class="value data6">TEST</strong>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="right-col">
        <div class="inner">
          <div class="entry bio">
            <span class="label">Bio</span>
            <div class="value">
              Flying since 2012. %{bio}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
