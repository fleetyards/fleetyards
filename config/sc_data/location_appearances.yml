# How a place is drawn until an admin says otherwise, keyed by the record's
# key. The locations loader applies an entry only where nothing is set yet: a
# colour where the place has none, a picture where it has none. Changing a
# value here never overwrites one an admin set.
#
# `color:` is a planet's or moon's sphere, or a star's glow. Most were taken
# from the 2022 pictures of the bodies (Locations::ImageColor); the rest are
# read from the game's descriptions. A body with a type (gas or ice giant,
# asteroid, city planet) has a fallback of its own, so needs no entry.
#
# `image:` is the header picture on the place's page: a file in the repo,
# under `db/seeds/locations`, attached on the first load that finds the place
# without one. Kept here rather than linked, since the RSI media links the
# pictures came from do not last.
---
