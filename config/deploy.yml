# Kamal deploy configuration for Fleetyards
# See https://kamal-deploy.org/docs/configuration/ for full reference
#
# Use destinations for environment-specific overrides:
#   kamal deploy -d live
#   kamal deploy -d stage

service: fleetyards
deploy_timeout: 120

image: fleetyards/app

servers:
  web:
    options:
      memory: 4g
  worker:
    cmd: bundle exec sidekiq -C config/sidekiq.yml
    options:
      memory: 3g
  discord_bot:
    # Long-running Gateway listener that turns Discord scheduled-event RSVPs
    # into Fleetyards signups. Single instance per Discord application — do
    # not scale this role above 1. Host comes from the destination config.
    cmd: bin/discord-bot
    options:
      memory: 512m
    # Bot token + application_id come from Rails encrypted credentials
    # via RAILS_MASTER_KEY (already in env.secret), no extra env vars
    # needed.

proxy:
  ssl: true
  forward_headers: true
  app_port: 3000
  healthcheck:
    interval: 3
    timeout: 10
    path: /up

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  args:
    GIT_REVISION: <%= `git rev-parse HEAD`.strip %>
  secrets:
    - RAILS_MASTER_KEY

ssh:
  user: kamal

env:
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "1"
    RAILS_SERVE_STATIC_FILES: "true"
    WORKER_COUNT: "2"
    MAX_THREADS: "5"
    MIN_THREADS: "5"
    ON_SUBDOMAIN: "true"
  secret:
    # Rails core (all other secrets are in Rails credentials)
    - RAILS_MASTER_KEY
    # Database
    - DATABASE_URL
    # Redis
    - REDIS_URL
accessories:
  db:
    image: postgres:16
    # Everything below the two `pg_stat_statements` flags is off its default,
    # and the defaults are the ones PostgreSQL ships for a machine nothing here
    # resembles. Strength of the case differs per line and is noted with it.
    #
    # random_page_cost         Measured. At 4 a random read is priced like a
    #                          seek on a spinning disk, and the planner rejects
    #                          index scans it should take -- the fleet counts
    #                          read all 1.57M rows of `vehicles` instead of the
    #                          few thousand in the fleet. At 1.1 that query goes
    #                          61ms -> 15ms and the hangar list 63ms -> 13ms,
    #                          with none of six measured getting slower.
    # shared_buffers           Sized, not measured. The database is 2.5GB and
    #                          `vehicles` plus `fleet_vehicles` with their
    #                          indexes are 630MB of it; at 128MB none of that
    #                          hot set can live in the buffers at all. 1GB of
    #                          the container's 4GB leaves room for the ~45
    #                          connections and their work_mem.
    # max_wal_size             Suspected. The sign-in tracking UPDATE takes
    #                          3.56ms on an idle copy and 32ms here, which is
    #                          what checkpoints forced by WAL volume rather
    #                          than by time look like. Costs disk and a longer
    #                          crash recovery.
    # wal_compression          Same suspicion, other end: less WAL means fewer
    #                          forced checkpoints and smaller full-page writes,
    #                          for some CPU.
    # effective_io_concurrency 1 is the value for a single spindle. Little is
    #                          expected of this on a mostly-cached database; it
    #                          is here because it costs nothing.
    #
    # work_mem is deliberately left alone: six of the slow queries were checked
    # with EXPLAIN (ANALYZE, BUFFERS) and none spilled to disk.
    cmd: >-
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c random_page_cost=1.1
      -c shared_buffers=1GB
      -c max_wal_size=4GB
      -c wal_compression=lz4
      -c effective_io_concurrency=200
    port: "5432:5432"
    env:
      clear:
        POSTGRES_DB: fleetyards_production
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    options:
      memory: 4g

  redis:
    image: redis:7.2.15
    port: "6379:6379"
    cmd: redis-server --maxmemory 1536mb --maxmemory-policy allkeys-lru
    directories:
      - data:/data
    options:
      memory: 2g

  db-backup:
    image: eeshugerman/postgres-backup-s3:16
    env:
      clear:
        POSTGRES_HOST: fleetyards-db
        SCHEDULE: "0 3 * * *"
        S3_ENDPOINT: https://fsn1.your-objectstorage.com
        S3_PREFIX: db
        BACKUP_KEEP_DAYS: 7
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
        - S3_ACCESS_KEY_ID
        - S3_SECRET_ACCESS_KEY
    options:
      memory: 256m
