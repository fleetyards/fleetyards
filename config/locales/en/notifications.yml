    friend_request_accepted:
      title: "%{username} accepted your friend request"
    fleet_ally_request_received:
      title: "%{fleet} wants to ally with %{own_fleet}"
    fleet_ally_request_accepted:
      title: "%{fleet} is now allied with %{own_fleet}"
    tour_join_request_received:
