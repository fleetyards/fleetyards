<%
  creds = Rails.app.creds

  hetzner_protocol = creds.option(:s3_protocol)
  hetzner_host = creds.option(:s3_endpoint)
  hetzner_endpoint = "#{hetzner_protocol}://#{hetzner_host}" if hetzner_protocol.present? && hetzner_host.present?

  bunny_configured = creds.option(:bunny_s3, :endpoint).present?

  # While the uploads move between providers, `cloud` writes to both: uploads
  # and variants go to the primary, ActiveStorage::MirrorJob copies them to the
  # other store, and reads and URLs come from the primary. STORAGE_PRIMARY says
  # which store that is.
  primary = creds.option(:storage_primary, default: "hetzner")
  raise "storage_primary must be hetzner or bunny, not #{primary.inspect}" unless %w[hetzner bunny].include?(primary)
  raise "storage_primary is bunny, but the bunny_s3 store is not configured" if primary == "bunny" && !bunny_configured
%>
test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

# Files missing from storage/ are read from the public storage CDN and kept; an
# empty STORAGE_ORIGIN turns that off.
local:
  service: ReadThroughDisk
  root: <%= Rails.root.join("storage") %>
  origin: <%= ENV.fetch("STORAGE_ORIGIN", "https://storage.fltyrd.net").to_json %>

hetzner: &hetzner
  service: S3
  endpoint: <%= hetzner_endpoint %>
  access_key_id: <%= creds.option(:s3_access_key) %>
  secret_access_key: <%= creds.option(:s3_secret_key) %>
  bucket: <%= creds.option(:s3_bucket) %>
  region: <%= creds.option(:s3_region, default: "unused") %>
  public: true
  upload:
    acl: "public-read"
  # The SDK's standard mode backs a throttled request off with jitter, which
  # the legacy default does not; Hetzner answers a busy bucket with SlowDown.
  retry_mode: standard
  retry_limit: 5

bunny:
  service: S3
  endpoint: <%= creds.option(:bunny_s3, :endpoint) %>
  access_key_id: <%= creds.option(:bunny_s3, :access_key_id) %>
  secret_access_key: <%= creds.option(:bunny_s3, :secret_access_key) %>
  bucket: <%= creds.option(:bunny_s3, :bucket) %>
  region: <%= creds.option(:bunny_s3, :region) %>
  public: true
  upload:
    acl: "public-read"
  retry_mode: standard
  retry_limit: 5

<% if bunny_configured %>
cloud:
  service: Mirror
  primary: <%= primary %>
  mirrors:
    - <%= (primary == "hetzner") ? "bunny" : "hetzner" %>
<% else %>
cloud:
  <<: *hetzner
<% end %>
