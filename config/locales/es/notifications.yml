      more_items: "y %{count} más"
      summary:
        imported_vehicles: Naves agregadas
        found_vehicles: Naves encontradas
        moved_vehicles_to_wanted: Naves movidas a la lista de deseos
        deleted_vehicles: Naves eliminadas
