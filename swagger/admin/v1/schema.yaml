components:
  schemas:
    AdminCargoHold:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parentType:
          type: string
        parentId:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
        capacityScu:
          type: number
        dimensionX:
          type: number
        dimensionY:
          type: number
        dimensionZ:
          type: number
        offsetX:
          type: number
        offsetY:
          type: number
        offsetZ:
          type: number
        rotation:
          type: integer
        parent:
          "$ref": "#/components/schemas/AdminCargoHoldParent"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - id
      - parentType
      - parentId
      - capacityScu
      - dimensionX
      - dimensionY
      - dimensionZ
      - createdAt
      - updatedAt
      title: AdminCargoHold
    AdminCargoHoldParent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
      required:
      - id
      - name
      title: AdminCargoHoldParent
    AdminCargoHolds:
      type: object
      properties:
        meta:
          "$ref": "#/components/schemas/Meta"
        items:
          type: array
