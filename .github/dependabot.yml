version: 2

updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ruby
    ignore:
      # ActionCable's redis pubsub adapter declares `>= 4, < 6`, so redis 6
      # raises Gem::LoadError on boot. Mirrors the `gem "redis", "< 6"` pin in
      # the Gemfile — lift both once Rails ships the redis-client-based
      # adapter (8.2+).
      - dependency-name: redis
        versions:
          - ">= 6"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      playwright:
        patterns:
          - "playwright"
          - "@playwright/*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
