name: Agent Feedback

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: agent-feedback-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  revise:
    # Two ways in: anyone with write access says @claude on a pull request, or a
    # reviewer requests changes on a branch the agent opened.
    if: >-
      (
        github.event.issue.pull_request != null
        && contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
      ) || (
        github.event_name == 'pull_request_review'
        && github.event.review.state == 'changes_requested'
        && github.event.review.user.type != 'Bot'
        && startsWith(github.event.pull_request.head.ref, 'agent/')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    env:
      PR: ${{ github.event.issue.number || github.event.pull_request.number }}

    steps:
      # A public repository means anyone can comment. Only people who could push
      # the change themselves get to ask the agent to push it for them.
      - name: Check the author can write here
        if: github.event_name != 'pull_request_review'
        env:
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) echo "::error::$ASSOCIATION has no write access"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      - name: Check out the pull request branch
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          git config user.name "${{ secrets.GIT_USER }}"
          git config user.email "${{ secrets.GIT_EMAIL }}"
          gh pr checkout "$PR"

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: ./.github/workflows/js-setup-action

      - name: Collect the feedback
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          gh pr view "$PR" --json title,body,comments,reviews \
            --template '# {{.title}}

          {{.body}}

          ## Conversation
          {{range .comments}}### {{.author.login}}
          {{.body}}

          {{end}}
          ## Reviews
          {{range .reviews}}### {{.author.login}} ({{.state}})
          {{.body}}

          {{end}}' > "${{ runner.temp }}/feedback.md"

          gh api "repos/${{ github.repository }}/pulls/$PR/comments" \
            --jq '.[] | "### \(.user.login) on \(.path):\(.line // .original_line)\n\(.body)\n"' \
            >> "${{ runner.temp }}/feedback.md"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          prompt: |
            You are revising pull request #${{ env.PR }} of this repository in
            response to review feedback. The branch is already checked out.

            Every comment and inline review comment on the pull request is
            collected at ${{ runner.temp }}/feedback.md. Read it first, then read
            AGENTS.md and follow it.

            Rules for this run:
            - Address the feedback and nothing else. Do not take the opportunity
              to refactor unrelated code.
            - Feedback you disagree with is still feedback: if you think a comment
              is wrong, say so in your summary and explain why, rather than
              silently ignoring it or silently complying.
            - Ruby lint is standardrb, invoked as ./bin/ruby-lint. For frontend
              changes run `pnpm run lint:js` and `pnpm run lint:ts`; lint:ts needs
              `bin/vite build --mode=test` first on a cold checkout.
            - Do NOT run the full test suite and do NOT commit or push. Leave your
              work in the working tree; the workflow commits it.
            - Write a reply to ${{ runner.temp }}/reply.md: one line per piece of
              feedback saying what you did about it, and anything you could not
              verify. Be honest about what you skipped.
          claude_args: |
            --max-turns 40
            --model claude-opus-5
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"

      - name: Push the revision
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          reply="${{ runner.temp }}/reply.md"
          [ -f "$reply" ] || echo "The agent produced no summary." > "$reply"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "fix: address review feedback on #${PR}"
            git push
          else
            printf '\nNo code changes were needed.\n' >> "$reply"
          fi
          printf '\n\n🤖\n' >> "$reply"

          gh pr comment "$PR" --body-file "$reply"
