<% web_ips = `bash .kamal/server-ips web live`.strip.split(',') %>
<% acc_ips = `bash .kamal/server-ips accessory live`.strip.split(',') %>

# Kamal destination: live (production)
# Deploy with: kamal deploy -d live

servers:
  web:
    hosts:
<%= web_ips.map { |ip| "      - #{ip}" }.join("\n") %>
  worker:
    hosts:
<%= web_ips.map { |ip| "      - #{ip}" }.join("\n") %>
  discord_bot:
    hosts:
      - <%= ENV.fetch("KAMAL_DISCORD_BOT_HOST", web_ips.first) %>
    env:
      clear:
        DISCORD_SERVER_MEMBERS_INTENT: "true"

builder:
  args:
    CDN_ENDPOINT: "https://cdn.fltyrd.net"

proxy:
  ssl: false

env:
  clear:
    RAILS_ENV: production
    WORKER_COUNT: "3"
    MAX_THREADS: "8"
    DOMAIN: fleetyards.net
    SHORT_DOMAIN: fltyrd.net
    CDN_ENDPOINT: "https://cdn.fltyrd.net"
    STORAGE_CDN_ENDPOINT: "https://storage.fltyrd.net"
    MAILER_DEFAULT_FROM: "info@fleetyards.net"
    CABLE_ENDPOINT: "wss://fleetyards.net/cable"
    TRUSTED_PROXY_IPS: "91.98.1.57"
    # Uploads are written to both stores while they move to Bunny; this one is
    # read from. Flipping it to bunny is the switch, flipping back the rollback.
    STORAGE_PRIMARY: bunny
    BUNNY_S3__ENDPOINT: https://de-s3.storage.bunnycdn.com
    BUNNY_S3__BUCKET: fltyrd-live-uploads
    BUNNY_S3__REGION: de

accessories:
  db:
    host: <%= acc_ips.first %>
  redis:
    host: <%= acc_ips.first %>
  db-backup:
    host: <%= acc_ips.first %>
    env:
      clear:
        POSTGRES_DATABASE: fleetyards_production
        S3_BUCKET: fltyrd-live-backups
  db-backup-r2:
    host: <%= acc_ips.first %>
    env:
      clear:
        POSTGRES_DATABASE: fleetyards_production
        S3_BUCKET: fltyrd-live-backups
  uploads-copy:
    host: <%= acc_ips.first %>
  # rclone, idle, for copying the game data from Hetzner to R2, through
  # bin/sc-data-copy. Only here: stage reads the same bucket.
  sc-data-copy:
    image: rclone/rclone:1.75.2
    host: <%= acc_ips.first %>
    cmd: infinity
    env:
      clear:
        RCLONE_CONFIG_HETZNER_TYPE: s3
        RCLONE_CONFIG_HETZNER_PROVIDER: Other
        RCLONE_CONFIG_HETZNER_ENDPOINT: https://fsn1.your-objectstorage.com
        RCLONE_CONFIG_HETZNER_REGION: fsn1
        RCLONE_CONFIG_R2_TYPE: s3
        RCLONE_CONFIG_R2_PROVIDER: Cloudflare
        RCLONE_CONFIG_R2_REGION: auto
        RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      secret:
        - RCLONE_CONFIG_HETZNER_ACCESS_KEY_ID
        - RCLONE_CONFIG_HETZNER_SECRET_ACCESS_KEY
        - RCLONE_CONFIG_R2_ENDPOINT
        - RCLONE_CONFIG_R2_ACCESS_KEY_ID
        - RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
    options:
      entrypoint: sleep
      memory: 1g
