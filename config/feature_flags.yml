# Feature flag registry — single source of truth for Flipper.
#
# `rake feature_flags:sync` makes Flipper match this file: it adds flags listed
# here that are missing, and removes flags in Flipper that are not listed here
# (prune, including all of their gate values). Sync runs on every deploy from
# .kamal/hooks/pre-deploy. Flags are never created or deleted through the admin
# UI — only their gates are toggled there.
#
# Schema per flag (mapping keyed by flag name):
#   <flag_name>:                 # [a-z][a-z0-9_-]*
#     description: "…"           # REQUIRED — what does the flag toggle?
#     permanent: true            # optional — long-lived infrastructure gate
#                                #   rather than a temporary rollout
#
# Rules are enforced by `rake feature_flags:validate` and bin/lint-feature-flags,
# which CI runs on every push. Seeded from the flags live in Flipper at the time
# the registry was introduced.

fleet_logistics:
  description: "Fleet logistics — fleet inventories with a deposit/withdrawal ledger"

fleet_starmap:
  description: "Starmap on the fleet page"

fleet_worldmap:
  description: "Member worldmap on the fleet page"

hangar_inventories:
  description: "Personal hangar inventories with a deposit/withdrawal ledger"

# Superseded by the hardpoints redesign; the flag was removed from the code in
# #4176 and is kept here only so this registry does not prune it as a side
# effect of being introduced. Delete this entry to retire the flag.
hardpoints-v2:
  description: "Legacy hardpoints v2 rollout — no longer referenced in code"

oauth-applications:
