---
es:
  notifications:
    hangar_create:
      title: "%{model} agregado al hangar"
    hangar_destroy:
      title: "%{model} eliminado del hangar"
    wishlist_create:
      title: "%{model} agregado a la lista de deseos"
    wishlist_destroy:
      title: "%{model} eliminado de la lista de deseos"
    model_on_sale:
      title: "%{model} está en venta"
      body: "%{model} está actualmente en venta en la tienda de pledge."
    hangar_sync_finished:
      title: Sincronización del hangar completada
      body: Su hangar RSI ha sido sincronizado exitosamente.
      warnings: Advertencias
      more_items: "y %{count} más"
      summary:
        imported_vehicles: Naves agregadas
        found_vehicles: Naves encontradas
        moved_vehicles_to_wanted: Naves movidas a la lista de deseos
        deleted_vehicles: Naves eliminadas
        grouped_vehicles: Naves archivadas en un grupo
        unchanged_vehicles: Naves sin cambios
        imported_components: Componentes agregados
        found_components: Componentes encontrados
        imported_upgrades: Mejoras agregadas
        found_upgrades: Mejoras encontradas
        synced_paints: Pinturas sincronizadas
        synced_hangar_flair: Decoración de hangar sincronizada
        missing_models: Naves no encontradas
        missing_components: Componentes no encontrados
        missing_component_vehicles: No se encontró una nave para los componentes
        missing_upgrades: Mejoras no encontradas
        missing_upgrade_vehicles: No se encontró una nave para las mejoras
    hangar_sync_failed:
      title: Sincronización del hangar fallida
      body: 'La sincronización de su hangar RSI falló: %{error}'
    new_model:
      title: 'Nueva nave: %{model}'
      body: "%{model} ha sido agregado a la base de datos de naves."
    inventory_transfer_received:
      title: "%{sender} te ha enviado %{count} objeto(s)"
      title_fleet: "%{sender} ha enviado %{count} objeto(s) a %{fleet}"
    inventory_transfer_resolved:
      title: "Tu transferencia a %{recipient} fue %{outcome}"
    fleet_invite:
      title: Ha sido invitado a %{fleet}
    fleet_member_requested:
      title: "%{username} solicitó unirse a %{fleet}"
    fleet_subscription_started:
      title: "%{fleet} ya tiene las funciones de flota"
    fleet_subscription_ended:
      title: "%{fleet} ha perdido las funciones de flota — %{reason}"
      reasons:
        contribution: "la donación que la apoyaba ya no está activa"
        manual: "un administrador ha finalizado la concesión"
    fleet_rsi_verification_lost:
      title: "%{fleet} ya no está verificada para %{sid}"
      body: "Otra flota demostró que gestiona la organización de RSI %{sid} poniendo su código de verificación en la página de la organización. Tu flota ya no muestra el SID como verificado. Si %{sid} es tu organización, vuelve a verificarla desde los ajustes de la flota."
    fleet_fid_claim_opened:
      title: "%{claimant} reclama el ID de flota %{fid}"
      body: "%{claimant} demostró que gestiona la organización de RSI **%{fid}**, así que puede quedarse con el ID de flota correspondiente.\n\n**El %{date}:**\n\n- %{fleet} pasa al siguiente ID de flota libre, como **%{fid}-1**.\n- Los enlaces a %{fid} abrirán %{claimant} desde entonces.\n\n**Para conservar el ID**, verifica %{fid} antes desde los ajustes de la flota. Si no, avisa a tus miembros de la nueva dirección."
    fleet_fid_claim_completed:
      claimant:
        title: "%{fleet} ya tiene el ID de flota %{fid}"
        body: "El periodo de gracia ha terminado y el ID de flota %{fid} es vuestro. Los enlaces a %{fid} ya abren tu flota."
      holder:
        title: "%{fleet} ahora es %{new_fid}"
        body: "El ID de flota %{fid} ha pasado a %{claimant}, que está verificada para la organización de RSI %{fid}. El ID y la dirección de tu flota son ahora %{new_fid}, y los enlaces antiguos a %{fid} abren %{claimant}."
    fleet_fid_claim_cancelled:
      holder_withdrawn:
        title: "Se ha retirado la reclamación de %{fid}"
        body: "%{claimant} retiró su reclamación, así que %{fleet} conserva el ID de flota %{fid}."
      holder_holder_verified:
        title: "%{fleet} conserva el ID de flota %{fid}"
        body: "Tu flota ya está verificada para la organización de RSI %{fid}, así que la reclamación de %{claimant} ha terminado."
      holder_claimant_unverified:
        title: "La reclamación de %{fid} ha terminado"
        body: "%{claimant} ya no está verificada para la organización de RSI %{fid}, así que %{fleet} conserva el ID de flota."
      holder_admin:
        title: "Se ha cancelado la reclamación de %{fid}"
        body: "Un administrador canceló la reclamación de %{claimant}, así que %{fleet} conserva el ID de flota %{fid}."
      claimant_holder_verified:
        title: "Tu reclamación de %{fid} ha terminado"
        body: "%{holder} demostró que gestiona la organización de RSI %{fid}, así que %{fleet} ya no está verificada para ella y la reclamación ha terminado."
      claimant_claimant_unverified:
        title: "Tu reclamación de %{fid} ha terminado"
        body: "%{fleet} ya no está verificada para la organización de RSI %{fid}, así que la reclamación ha terminado."
      claimant_admin:
        title: "Se ha cancelado tu reclamación de %{fid}"
        body: "Un administrador canceló la reclamación de %{fleet} sobre el ID de flota %{fid}."
    rsi_handle_verification_lost:
      title: "Tu handle de RSI %{handle} ya no está verificado"
      body: "Otra cuenta de Fleetyards demostró que el handle de RSI %{handle} le pertenece, mediante Citizen iD o con su código de verificación en la biografía de RSI. Tu perfil ya no muestra el handle como verificado. Si %{handle} es tuyo, vuelve a verificarlo desde los ajustes de tu perfil."
    fleet_member_accepted:
      title: "%{username} se unió a %{fleet}"
    fleet_request_accepted:
      title: Ha sido aceptado en %{fleet}
    fleet_joined_by_discord_role:
