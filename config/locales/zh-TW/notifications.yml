---
zh-TW:
  notifications:
    hangar_create:
      title: "%{model} 已新增到機庫"
    hangar_destroy:
      title: "%{model} 已從機庫移除"
    wishlist_create:
      title: "%{model} 已新增到願望清單"
    wishlist_destroy:
      title: "%{model} 已從願望清單移除"
    model_on_sale:
      title: "%{model} 正在出售"
      body: "%{model} 目前在質押商店中出售。"
    hangar_sync_finished:
      title: 機庫同步完成
      body: 您的 RSI 機庫已成功同步。
      warnings: 警告
      more_items: "以及另外 %{count} 項"
      summary:
        imported_vehicles: 已新增的飛船
        found_vehicles: 已找到的飛船
        moved_vehicles_to_wanted: 已移至願望清單的飛船
        deleted_vehicles: 已刪除的飛船
        grouped_vehicles: 已歸入分組的飛船
        unchanged_vehicles: 保持不變的飛船
        imported_components: 已新增的元件
        found_components: 已找到的元件
        imported_upgrades: 已新增的升級
        found_upgrades: 已找到的升級
        synced_paints: 已同步塗裝
        synced_hangar_flair: 已同步機庫裝飾
        missing_models: 未找到的飛船
        missing_components: 未找到的元件
        missing_component_vehicles: 沒有與元件相符的飛船
        missing_upgrades: 未找到的升級
        missing_upgrade_vehicles: 沒有與升級相符的飛船
    hangar_sync_failed:
      title: 機庫同步失敗
      body: '您的 RSI 機庫同步失敗: %{error}'
    new_model:
      title: '新飛船: %{model}'
      body: "%{model} 已新增到飛船資料庫。"
    inventory_transfer_received:
      title: "%{sender} 向你傳送了 %{count} 件物品"
      title_fleet: "%{sender} 向 %{fleet} 傳送了 %{count} 件物品"
    inventory_transfer_resolved:
      title: "你傳往 %{recipient} 的轉移已%{outcome}"
    fleet_invite:
      title: 您已被邀請加入 %{fleet}
    fleet_member_requested:
      title: "%{username} 請求加入 %{fleet}"
    fleet_subscription_started:
      title: "%{fleet} 現已獲得艦隊功能"
    fleet_subscription_ended:
      title: "%{fleet} 已失去艦隊功能 — %{reason}"
      reasons:
        contribution: "支援該艦隊的捐贈已不再有效"
        manual: "管理員已結束該授權"
    fleet_rsi_verification_lost:
      title: "%{fleet} 不再是 %{sid} 的已驗證艦隊"
      body: "另一支艦隊將其驗證碼放到了 RSI 組織 %{sid} 的頁面上，證明它在管理該組織。你的艦隊不再將該 SID 顯示為已驗證。如果 %{sid} 是你的組織，請在艦隊設定中重新驗證。"
    fleet_fid_claim_opened:
      title: "%{claimant} 申領艦隊 ID %{fid}"
      body: "%{claimant} 已證明它在管理 RSI 組織 **%{fid}**，因此可以取得對應的艦隊 ID。\n\n**%{date}：**\n\n- %{fleet} 將改用下一個空閒艦隊 ID，例如 **%{fid}-1**。\n- 此後指向 %{fid} 的連結會開啟 %{claimant}。\n\n**如需保留該 ID**，請在此之前到艦隊設定中驗證 %{fid}；否則請通知你的成員網址即將變更。"
    fleet_fid_claim_completed:
      claimant:
        title: "%{fleet} 現在擁有艦隊 ID %{fid}"
        body: "寬限期已結束，艦隊 ID %{fid} 歸你們所有。指向 %{fid} 的連結現在會開啟你的艦隊。"
      holder:
        title: "%{fleet} 現在是 %{new_fid}"
        body: "艦隊 ID %{fid} 已轉給 %{claimant}，它已通過 RSI 組織 %{fid} 的驗證。你的艦隊 ID 和網址現在是 %{new_fid}，指向 %{fid} 的舊連結會開啟 %{claimant}。"
    fleet_fid_claim_cancelled:
      holder_withdrawn:
        title: "對 %{fid} 的申領已撤回"
        body: "%{claimant} 撤回了申領，%{fleet} 保留艦隊 ID %{fid}。"
      holder_holder_verified:
        title: "%{fleet} 保留艦隊 ID %{fid}"
        body: "你的艦隊現已通過 RSI 組織 %{fid} 的驗證，%{claimant} 的申領因此結束。"
      holder_claimant_unverified:
        title: "對 %{fid} 的申領已結束"
        body: "%{claimant} 不再是 RSI 組織 %{fid} 的已驗證艦隊，%{fleet} 保留該艦隊 ID。"
      holder_admin:
        title: "對 %{fid} 的申領已取消"
        body: "管理員取消了 %{claimant} 的申領，%{fleet} 保留艦隊 ID %{fid}。"
      claimant_holder_verified:
        title: "你對 %{fid} 的申領已結束"
        body: "%{holder} 已證明它在管理 RSI 組織 %{fid}，因此 %{fleet} 不再是該組織的已驗證艦隊，申領已結束。"
      claimant_claimant_unverified:
        title: "你對 %{fid} 的申領已結束"
        body: "%{fleet} 不再是 RSI 組織 %{fid} 的已驗證艦隊，申領已結束。"
      claimant_admin:
        title: "你對 %{fid} 的申領已取消"
        body: "管理員取消了 %{fleet} 對艦隊 ID %{fid} 的申領。"
    rsi_handle_verification_lost:
      title: "你的 RSI 使用者名 %{handle} 不再是已驗證狀態"
      body: "另一個 Fleetyards 帳戶透過 Citizen iD 或將其驗證碼放入 RSI 個人簡介，證明了 RSI 使用者名 %{handle} 屬於它。你的個人資料不再將該使用者名顯示為已驗證。如果 %{handle} 是你的，請在個人資料設定中重新驗證。"
    fleet_member_accepted:
