name: Agent Issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to work on"
        required: true
        type: number

concurrency:
  group: agent-issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-task'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      # Consume the trigger so re-labelling is an explicit re-run rather than
      # an accident of someone editing the issue.
      - name: Drop the trigger label
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: gh issue edit "$ISSUE" --remove-label agent-task

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: ./.github/workflows/js-setup-action

      - name: Create the branch
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          slug=$(gh issue view "$ISSUE" --json title --jq '.title' \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' \
            | cut -c1-40 | sed -E 's/-+$//')
          branch="agent/${ISSUE}-${slug}"
          # A re-label means "try again", so never reuse a branch that already
          # has a pull request hanging off it.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            branch="${branch}-${GITHUB_RUN_NUMBER}"
          fi
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          git config user.name "${{ secrets.GIT_USER }}"
          git config user.email "${{ secrets.GIT_EMAIL }}"
          git switch -c "$branch"

      - name: Fetch the issue
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          gh issue view "$ISSUE" --json title,body,labels,comments \
            --template '# {{.title}}

          Labels: {{range .labels}}{{.name}} {{end}}

          {{.body}}

          ## Comments
          {{range .comments}}### {{.author.login}}
          {{.body}}

          {{end}}' > "${{ runner.temp }}/issue.md"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
          prompt: |
            Implement GitHub issue #${{ env.ISSUE }} of this repository. The full
            issue text, including its comments, is at ${{ runner.temp }}/issue.md — read
            it first.

            Read AGENTS.md before writing any code and follow it. It is the single
            source of truth for the conventions of this codebase, including the
            rule files it links to.

            Rules for this run:
            - Stay inside the scope of the issue. Do not refactor code the issue
              does not ask you to touch.
            - Ruby lint is standardrb, invoked as ./bin/ruby-lint — not bin/rubocop.
              Run it on the Ruby you changed.
            - For frontend changes run `pnpm run lint:js` and `pnpm run lint:ts`.
              lint:ts needs `bin/vite build --mode=test` first on a cold checkout,
              because auto-import types are generated by that build.
            - If you touch API endpoints, follow the API schema workflow in
              AGENTS.md — schema components are hand-written, a new jbuilder field
              does not regenerate anything.
            - If you add a user-facing string, translate it in every locale under
              config/locales and frontend/locales. There is no fallback safety net
              and nothing in CI checks parity.
            - Do NOT run the full test suite and do NOT commit, push, or open a
              pull request. Leave your work in the working tree; the workflow
              commits it.
            - When you are done, write a pull request body to
              ${{ runner.temp }}/pr-body.md: what you changed, why, what you could not
              verify, and anything a reviewer should look at closely. Be honest
              about gaps. End the file with the line "Closes #${{ env.ISSUE }}".
            - If the issue is too ambiguous to implement, make no code changes and
              write your open questions to ${{ runner.temp }}/pr-body.md instead.
          claude_args: |
            --max-turns 40
            --model claude-opus-5
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"

      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: |
          body="${{ runner.temp }}/pr-body.md"
          [ -f "$body" ] || echo "The agent produced no summary." > "$body"
          printf '\n\n🤖\n' >> "$body"

          if [ -z "$(git status --porcelain)" ]; then
            gh issue comment "$ISSUE" --body-file - <<EOF
          The agent made no code changes.

          $(cat "$body")
          EOF
            exit 0
          fi

          title=$(gh issue view "$ISSUE" --json title --jq '.title')
          git add -A
          git commit -m "feat: ${title}

          Closes #${ISSUE}"
          git push -u origin "$BRANCH"
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "feat: ${title}" \
            --body-file "$body" \
            --label wip
