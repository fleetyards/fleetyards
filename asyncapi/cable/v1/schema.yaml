---
asyncapi: 3.0.0
info:
  title: FleetYards.net Cable API
  version: v1
  license:
    name: GNU General Public License v3.0
    url: https://github.com/fleetyards/fleetyards/blob/main/LICENSE
channels:
  AppVersion:
    address: app_version
    x-actioncable-channel: AppVersionChannel
    messages:
      AppVersionMessage:
        "$ref": "#/components/messages/AppVersionMessage"
  FleetMembers:
    address: fleet_members:{user_gid}
    x-actioncable-channel: FleetMembersChannel
    parameters:
      user_gid:
        description: GlobalID param of the subscribed user, derived from the connection
        x-client-supplied: false
    messages:
      FleetMember:
        "$ref": "#/components/messages/FleetMember"
  FleetVehicles:
    address: fleet_vehicles:{user_gid}
    x-actioncable-channel: FleetVehiclesChannel
    parameters:
      user_gid:
        description: GlobalID param of the subscribed user, derived from the connection
        x-client-supplied: false
    messages:
      FleetMember:
        "$ref": "#/components/messages/FleetMember"
  Hangar:
    address: hangar:{user_gid}
    x-actioncable-channel: HangarChannel
    parameters:
      user_gid:
        description: GlobalID param of the subscribed user, derived from the connection
        x-client-supplied: false
    messages:
      Vehicle:
        "$ref": "#/components/messages/Vehicle"
  HangarCreate:
    address: hangar_create:{user_gid}
    x-actioncable-channel: HangarCreateChannel
    parameters:
      user_gid:
        description: GlobalID param of the subscribed user, derived from the connection
        x-client-supplied: false
    messages:
      Vehicle:
        "$ref": "#/components/messages/Vehicle"
  HangarDestroy:
    address: hangar_destroy:{user_gid}
    x-actioncable-channel: HangarDestroyChannel
    parameters:
      user_gid:
        description: GlobalID param of the subscribed user, derived from the connection
        x-client-supplied: false
    messages:
      Vehicle:
        "$ref": "#/components/messages/Vehicle"
  HangarSync:
    address: hangar_sync:{user_gid}
    x-actioncable-channel: HangarSyncChannel
    parameters:
      user_gid:
        description: GlobalID param of the subscribed user, derived from the connection
        x-client-supplied: false
    messages:
      HangarSyncFinishedMessage:
        "$ref": "#/components/messages/HangarSyncFinishedMessage"
      HangarSyncFailedMessage:
        "$ref": "#/components/messages/HangarSyncFailedMessage"
  Models:
    address: models
    x-actioncable-channel: ModelsChannel
    messages:
      Model:
        "$ref": "#/components/messages/Model"
  Notifications:
    address: notifications
    x-actioncable-channel: NotificationsChannel
    messages:
      AnnouncementMessage:
        "$ref": "#/components/messages/AnnouncementMessage"
  OnSale:
    address: on_sale
    x-actioncable-channel: OnSaleChannel
    messages:
      Model:
        "$ref": "#/components/messages/Model"
  OnSaleHangar:
    address: on_sale_hangar:{user_gid}
    x-actioncable-channel: OnSaleHangarChannel
    parameters:
      user_gid:
        description: GlobalID param of the subscribed user, derived from the connection
        x-client-supplied: false
    messages:
      Vehicle:
        "$ref": "#/components/messages/Vehicle"
  UserNotifications:
    address: user_notifications:{user_gid}
    x-actioncable-channel: UserNotificationsChannel
    parameters:
      user_gid:
        description: GlobalID param of the subscribed user, derived from the connection
        x-client-supplied: false
    messages:
      Notification:
        "$ref": "#/components/messages/Notification"
  Wishlist:
    address: wishlist:{user_gid}
    x-actioncable-channel: WishlistChannel
    parameters:
      user_gid:
        description: GlobalID param of the subscribed user, derived from the connection
        x-client-supplied: false
    messages:
      Vehicle:
        "$ref": "#/components/messages/Vehicle"
  WishlistCreate:
    address: wishlist_create:{user_gid}
    x-actioncable-channel: WishlistCreateChannel
    parameters:
      user_gid:
        description: GlobalID param of the subscribed user, derived from the connection
        x-client-supplied: false
    messages:
      Vehicle:
        "$ref": "#/components/messages/Vehicle"
  WishlistDestroy:
    address: wishlist_destroy:{user_gid}
    x-actioncable-channel: WishlistDestroyChannel
    parameters:
      user_gid:
        description: GlobalID param of the subscribed user, derived from the connection
        x-client-supplied: false
    messages:
      Vehicle:
        "$ref": "#/components/messages/Vehicle"
operations:
  receiveAnnouncement:
    action: receive
    channel:
      "$ref": "#/channels/Notifications"
    messages:
    - "$ref": "#/channels/Notifications/messages/AnnouncementMessage"
    summary: An announcement shown to every connected client
  receiveAppVersion:
    action: receive
    channel:
      "$ref": "#/channels/AppVersion"
    messages:
    - "$ref": "#/channels/AppVersion/messages/AppVersionMessage"
    summary: A new application version was deployed
  receiveFleetMembers:
    action: receive
    channel:
      "$ref": "#/channels/FleetMembers"
    messages:
    - "$ref": "#/channels/FleetMembers/messages/FleetMember"
    summary: A membership in one of the user's fleets changed
  receiveFleetVehicles:
    action: receive
    channel:
      "$ref": "#/channels/FleetVehicles"
    messages:
    - "$ref": "#/channels/FleetVehicles/messages/FleetMember"
    summary: A fleet member's vehicles changed
  receiveHangarCreate:
    action: receive
    channel:
      "$ref": "#/channels/HangarCreate"
    messages:
    - "$ref": "#/channels/HangarCreate/messages/Vehicle"
    summary: A vehicle was added to the user's hangar
  receiveHangarDestroy:
    action: receive
    channel:
      "$ref": "#/channels/HangarDestroy"
    messages:
    - "$ref": "#/channels/HangarDestroy/messages/Vehicle"
    summary: A vehicle was removed from the user's hangar
  receiveHangarSyncResult:
    action: receive
    channel:
      "$ref": "#/channels/HangarSync"
    messages:
    - "$ref": "#/channels/HangarSync/messages/HangarSyncFinishedMessage"
    - "$ref": "#/channels/HangarSync/messages/HangarSyncFailedMessage"
    summary: Outcome of an RSI hangar sync run
  receiveHangarUpdate:
    action: receive
    channel:
      "$ref": "#/channels/Hangar"
    messages:
    - "$ref": "#/channels/Hangar/messages/Vehicle"
    summary: A vehicle in the user's hangar changed
  receiveModelUpdate:
    action: receive
    channel:
      "$ref": "#/channels/Models"
    messages:
    - "$ref": "#/channels/Models/messages/Model"
    summary: A ship model changed
  receiveOnSale:
    action: receive
    channel:
      "$ref": "#/channels/OnSale"
    messages:
    - "$ref": "#/channels/OnSale/messages/Model"
    summary: A ship model went on sale
  receiveOnSaleHangar:
    action: receive
    channel:
      "$ref": "#/channels/OnSaleHangar"
    messages:
    - "$ref": "#/channels/OnSaleHangar/messages/Vehicle"
    summary: A vehicle the user owns went on sale
  receiveUserNotification:
    action: receive
    channel:
      "$ref": "#/channels/UserNotifications"
    messages:
    - "$ref": "#/channels/UserNotifications/messages/Notification"
    summary: A notification addressed to one user
  receiveWishlistCreate:
    action: receive
    channel:
      "$ref": "#/channels/WishlistCreate"
    messages:
    - "$ref": "#/channels/WishlistCreate/messages/Vehicle"
    summary: A vehicle was added to the user's wishlist
  receiveWishlistDestroy:
    action: receive
    channel:
      "$ref": "#/channels/WishlistDestroy"
    messages:
    - "$ref": "#/channels/WishlistDestroy/messages/Vehicle"
    summary: A vehicle was removed from the user's wishlist
  receiveWishlistUpdate:
    action: receive
    channel:
      "$ref": "#/channels/Wishlist"
    messages:
    - "$ref": "#/channels/Wishlist/messages/Vehicle"
    summary: A wanted vehicle changed
components:
  schemas:
    AnnouncementMessage:
      type: object
      properties:
        text:
          type: string
        type:
          "$ref": "#/components/schemas/AnnouncementTypeEnum"
        persist:
          type: boolean
        timeout:
          type: integer
        background:
          type: boolean
      additionalProperties: false
      required:
      - text
    AnnouncementTypeEnum:
      type: string
      enum:
      - success
      - info
      - warning
      - alert
      x-enumNames:
      - SUCCESS
      - INFO
      - WARNING
      - ALERT
    AppVersionMessage:
      type: object
      properties:
        version:
          type: string
        codename:
          type: string
      additionalProperties: false
      required:
      - version
      - codename
    BoughtViaEnum:
      type: string
      enum:
      - pledge_store
      - ingame
      x-enumNames:
      - PLEDGE_STORE
      - INGAME
    CargoHold:
      type: object
      properties:
        name:
          type: string
        dimensions:
          "$ref": "#/components/schemas/CargoHoldDimension"
        capacity:
          type: integer
        maxContainerSize:
          "$ref": "#/components/schemas/CargoHoldContainerSize"
        limits:
          type: object
          properties:
            min:
              "$ref": "#/components/schemas/CargoHoldLimit"
            max:
              "$ref": "#/components/schemas/CargoHoldLimit"
          additionalProperties: false
          required:
          - min
        offset:
          type: object
          properties:
            x:
              type: number
            "y":
              type: number
            z:
              type: number
          additionalProperties: false
          required:
          - x
          - "y"
          - z
        rotation:
          type: integer
      additionalProperties: false
      required:
      - dimensions
      - capacity
      - maxContainerSize
      - limits
    CargoHoldContainerSize:
      type: object
      properties:
        size:
          type: integer
        dimensions:
          "$ref": "#/components/schemas/CargoHoldDimension"
      additionalProperties: false
      required:
      - size
      - dimensions
    CargoHoldDimension:
      type: object
      properties:
        x:
          type: number
        "y":
          type: number
        z:
          type: number
      additionalProperties: false
      required:
      - x
      - "y"
      - z
    CargoHoldLimit:
      type: object
      properties:
        dimensions:
          "$ref": "#/components/schemas/CargoHoldDimension"
        capacity:
          type: integer
      additionalProperties: false
      required:
      - dimensions
      - capacity
    Component:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        scKey:
          type: string
        scRef:
          type: string
        hidden:
          type: boolean
        category:
          type: string
        type:
          "$ref": "#/components/schemas/ComponentTypeEnum"
        subType:
          type: string
        inventoryConsumption:
          type: string
        grade:
          type: string
        gradeLabel:
          type: string
        size:
          type: string
        class:
          "$ref": "#/components/schemas/ComponentClassEnum"
        itemClass:
          "$ref": "#/components/schemas/ComponentItemClassEnum"
        itemClassLabel:
          type: string
        availability:
          type: object
          properties:
            boughtAt:
              type: array
              items:
                "$ref": "#/components/schemas/ItemPrice"
            soldAt:
              type: array
              items:
                "$ref": "#/components/schemas/ItemPrice"
          additionalProperties: false
          required:
          - boughtAt
          - soldAt
        manufacturer:
          "$ref": "#/components/schemas/Manufacturer"
        media:
          type: object
          properties:
            storeImage:
              "$ref": "#/components/schemas/MediaFile"
          additionalProperties: false
        typeData:
          anyOf:
          - "$ref": "#/components/schemas/ComponentQuantumDrive"
          - "$ref": "#/components/schemas/ComponentJumpDrive"
          - "$ref": "#/components/schemas/ComponentArmor"
          - "$ref": "#/components/schemas/CargoHold"
          - "$ref": "#/components/schemas/FuelTank"
          - "$ref": "#/components/schemas/ComponentThruster"
          - "$ref": "#/components/schemas/ComponentWeapon"
          - "$ref": "#/components/schemas/ComponentTractorBeam"
          - "$ref": "#/components/schemas/ComponentShield"
          - "$ref": "#/components/schemas/ComponentCooler"
          - "$ref": "#/components/schemas/ComponentRadar"
          - "$ref": "#/components/schemas/ComponentController"
          - "$ref": "#/components/schemas/ComponentPowerPlant"
        hardpoints:
          type: array
          items:
            "$ref": "#/components/schemas/Hardpoint"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - id
      - name
      - slug
      - hidden
      - availability
      - media
      - createdAt
      - updatedAt
    ComponentArmor:
      type: object
      properties:
        health:
          type: number
        damagePhysical:
          type: number
        damageEnergy:
          type: number
        damageDistortion:
          type: number
        damageThermal:
          type: number
        damageBiochemical:
          type: number
        damageStun:
          type: number
        deflectionPhysical:
          type: number
        deflectionEnergy:
          type: number
        deflectionDistortion:
          type: number
        deflectionThermal:
          type: number
        selfResistancePhysical:
          type: number
        selfResistanceEnergy:
          type: number
        selfResistanceDistortion:
          type: number
        selfResistanceThermal:
          type: number
        signalInfrared:
          type: number
        signalElectromagnetic:
          type: number
        signalCrossSection:
          type: number
      additionalProperties: false
    ComponentClassEnum:
      type: string
      enum:
      - RSIModular
      - RSIWeapon
      - RSIAvionic
      - RSIPropulsion
      - RSIThruster
      x-enumNames:
      - RSI_MODULAR
      - RSI_WEAPON
      - RSI_AVIONIC
      - RSI_PROPULSION
      - RSI_THRUSTER
    ComponentController:
      type: object
      properties:
        scmSpeed:
          type: number
        scmSpeedBoosted:
          type: number
        reverseSpeedBoosted:
          type: number
        maxSpeed:
          type: number
        angularVelocity:
          type: object
          properties:
            pitch:
              type: number
            yaw:
              type: number
            roll:
              type: number
          additionalProperties: false
        boostedAngularVelocity:
          type: object
          properties:
            pitch:
              type: number
            yaw:
              type: number
            roll:
              type: number
          additionalProperties: false
        powerConsumption:
          type: number
        powerMinimumFraction:
          type: number
        powerRanges:
          type: object
          properties:
            low:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
            medium:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
            high:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
          additionalProperties: false
        signatureEm:
          type: number
      additionalProperties: false
    ComponentCooler:
      type: object
      properties:
        coolingRate:
          type: number
        powerConsumption:
          type: number
        powerMinimumFraction:
          type: number
        powerRanges:
          type: object
          properties:
            low:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
            medium:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
            high:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
          additionalProperties: false
        signatureEm:
          type: number
        signatureIr:
          type: number
      additionalProperties: false
      required:
      - coolingRate
    ComponentItemClassEnum:
      type: string
      enum:
      - stealth
      - civilian
      - industrial
      - military
      - competition
      x-enumNames:
      - STEALTH
      - CIVILIAN
      - INDUSTRIAL
      - MILITARY
      - COMPETITION
    ComponentJumpDrive:
      type: object
      properties:
        alignmentRate:
          type: number
        alignmentDecayRate:
          type: number
        tuningRate:
          type: number
        tuningDecayRate:
          type: number
        fuelUsageEfficiencyMultiplier:
          type: number
      additionalProperties: false
    ComponentPowerPlant:
      type: object
      properties:
        powerBase:
          type: number
        powerDraw:
          type: number
        powerRanges:
          type: object
          properties:
            low:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
            medium:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
            high:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
          additionalProperties: false
        signatureEm:
          type: number
      additionalProperties: false
    ComponentQuantumDrive:
      type: object
      properties:
        quantumFuelRequirement:
          type: number
        quantumFuelConsumption:
          type: number
        jumpRange:
          type: number
        disconnectRange:
          type: number
        driveSpeed:
          type: number
        cooldownTime:
          type: number
        stageOneAccelRate:
          type: number
        stageTwoAccelRate:
          type: number
        engageSpeed:
          type: number
        calibrationRate:
          type: number
        minCalibrationRequirement:
          type: number
        maxCalibrationRequirement:
          type: number
        calibrationProcessAngleLimit:
          type: number
        calibrationWarningAngleLimit:
          type: number
        calibrationDelayInSeconds:
          type: number
        spoolUpTime:
          type: number
        splineJumpParams:
          "$ref": "#/components/schemas/ComponentQuantumDriveJump"
        quantumBoostParams:
          "$ref": "#/components/schemas/ComponentQuantumDriveBoost"
        powerConsumption:
          type: number
        powerMinimumFraction:
          type: number
        powerRanges:
          type: object
          properties:
            low:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
            medium:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
            high:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
          additionalProperties: false
        signatureEm:
          type: number
      additionalProperties: false
    ComponentQuantumDriveBoost:
      type: object
      properties:
        maxBoostSpeed:
          type: number
        timeToMaxBoostSpeed:
          type: number
        boostUseTime:
          type: number
        boostRechargeTime:
          type: number
        stopTime:
          type: number
        minJumpDistance:
          type: number
        ifcsHandoverDownTime:
          type: number
        ifcsHandoverRespoolTime:
          type: number
      additionalProperties: false
    ComponentQuantumDriveJump:
      type: object
      properties:
        driveSpeed:
          type: number
        cooldownTime:
          type: number
        stageOneAccelRate:
          type: number
        stageTwoAccelRate:
          type: number
        engageSpeed:
          type: number
        calibrationRate:
          type: number
        minCalibrationRequirement:
          type: number
        maxCalibrationRequirement:
          type: number
        calibrationProcessAngleLimit:
          type: number
        calibrationWarningAngleLimit:
          type: number
        calibrationDelayInSeconds:
          type: number
        spoolUpTime:
          type: number
      additionalProperties: false
    ComponentRadar:
      type: object
      properties:
        signatureDetection:
          type: object
          properties:
            ir:
              type: object
              properties:
                sensitivity:
                  type: number
                piercing:
                  type: number
              additionalProperties: false
            em:
              type: object
              properties:
                sensitivity:
                  type: number
                piercing:
                  type: number
              additionalProperties: false
            cs:
              type: object
              properties:
                sensitivity:
                  type: number
                piercing:
                  type: number
              additionalProperties: false
            rs:
              type: object
              properties:
                sensitivity:
                  type: number
                piercing:
                  type: number
              additionalProperties: false
          additionalProperties: false
        pingProperties:
          type: object
          properties:
            cooldownTime:
              type: number
          additionalProperties: false
        aimAssistRange:
          type: number
        aimAssistMin:
          type: number
        sensitivityModifiers:
          type: object
          properties:
            sensitivityAddition:
              type: number
          additionalProperties: false
        powerConsumption:
          type: number
        powerMinimumFraction:
          type: number
        powerRanges:
          type: object
          properties:
            low:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
            medium:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
            high:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
          additionalProperties: false
        signatureEm:
          type: number
      additionalProperties: false
    ComponentShield:
      type: object
      properties:
        maxHealth:
          type: number
        maxRegen:
          type: number
        decayRatio:
          type: number
        downedRegenDelay:
          type: number
        damagedRegenDelay:
          type: number
        resistance:
          type: object
          properties:
            physical:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
            energy:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
            distortion:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
            thermal:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
            biochemical:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
            stun:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
          additionalProperties: false
        absorption:
          type: object
          properties:
            physical:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
            energy:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
            distortion:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
            thermal:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
            biochemical:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
            stun:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
              additionalProperties: false
          additionalProperties: false
        powerConsumption:
          type: number
        powerMinimumFraction:
          type: number
        powerRanges:
          type: object
          properties:
            low:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
            medium:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
            high:
              type: object
              properties:
                start:
                  type: number
                modifier:
                  type: number
              additionalProperties: false
          additionalProperties: false
        signatureEm:
          type: number
      additionalProperties: false
      required:
      - maxHealth
      - maxRegen
    ComponentThruster:
      type: object
      properties:
        thrustCapacity:
          type: number
        thrusterType:
          type: string
        thrusterClass:
          "$ref": "#/components/schemas/ThrusterClassEnum"
        fuelBurnRatePer10KNewton:
          type: number
      additionalProperties: false
      required:
      - thrustCapacity
      - thrusterType
      - fuelBurnRatePer10KNewton
    ComponentTractorBeam:
      type: object
      properties:
