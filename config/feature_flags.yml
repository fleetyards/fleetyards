# Feature flag registry — single source of truth for Flipper.
#
# `bin/feature-flags sync` makes Flipper match this file: it adds flags listed
# here that are missing, and removes flags in Flipper that are not listed here
# (prune, including all of their gate values). Sync runs on every deploy from
# .kamal/hooks/pre-deploy. The admin UI cannot create or delete flags — it only
# toggles the gates of flags declared here.
#
# Schema per flag (mapping keyed by flag name):
#   <flag_name>:                 # [a-z][a-z0-9_-]*
#     description: "…"           # REQUIRED — what does the flag toggle?
#     permanent: true            # optional — long-lived infrastructure gate
#                                #   rather than a temporary rollout
#
# Rules are enforced by `bin/feature-flags validate`, which CI runs on every
# push. Seeded from the flags live in Flipper at the time the registry was
# introduced.

fleet_allies:
  description: "Fleet alliances — a fleet sharing its ships, stats and roster with another fleet"

fleet_contracts:
  description: "Fleet contracts — jobs members claim, tracked through the transfer ledger"

fleet_logistics:
  description: "Fleet logistics — fleet inventories with a deposit/withdrawal ledger"

fleet_mission_builder:
  description: "Mission builder — fleet missions, events, the calendar and Discord sync"

# Rollout only, never entitlement. This decides whether the supporter-facing
# subscription surfaces exist at all -- the nomination in settings, and later
# the admin pages and the premium gates. Whether a given fleet has *bought*
# anything is answered by fleet_subscriptions rows, never by this flag: a deploy
# prunes gate values, a gate can only grant, and neither can express a
# revocation. See D1 in docs/exec-plans/premium-fleet-features.md.
#
# Off everywhere until the transition is announced, so the whole entitlement
# half can land in production without anybody meeting it early.
fleet_subscriptions:
  description: "Fleet subscriptions — the supporter-facing surfaces of the premium rollout"

# Stacks on tour_payouts rather than replacing it: that flag is what makes
# tours exist at all, and this one decides whether a fleet runs them as a fleet
# -- its own tour list, members asking onto them, and the payout ledger on a
# fleet event. Both have to be on.
#
# The split is by owner, not by feature: every fleet-scoped payout surface is
# behind this, every personal one behind tour_payouts. That is what lets one be
# priced without the other.
fleet_tours:
  description: "Fleet tours — a fleet's own tour list and its payouts, with members asking to join"

# Moving stock between two inventories. Rides on top of the three gates above
# rather than replacing them: a transfer touching a fleet inventory still needs
# fleet_logistics, and one touching a ship still needs ship_inventories.
# Otherwise this would be a way around them.
inventory_transfers:
  description: "Transfers — moving stock between two inventories"

friends:
  description: "Friends — a user sharing a hangar, wishlist or stats with people they know"

hangar_inventories:
  description: "Personal hangar inventories with a deposit/withdrawal ledger"

# Rides its own gate rather than hangar_inventories: a ship's cargo is a
# separate surface and rolls out on its own schedule.
ship_inventories:
  description: "Ship inventories — the cargo aboard a vehicle"

oauth-applications:
  description: "User-owned OAuth applications in settings"
  permanent: true

oauth-bluesky:
  description: "Bluesky login"
  permanent: true

oauth-citizenid:
  description: "CitizenID login"
  permanent: true

oauth-discord:
  description: "Discord login"
  permanent: true

oauth-github:
  description: "GitHub login"
  permanent: true

oauth-google:
  description: "Google login"
  permanent: true

oauth-patreon:
  description: "Patreon account connection, for matching a pledge to an account"
  permanent: true

oauth-twitch:
  description: "Twitch login"
  permanent: true

# What makes a payout ledger exist at all, and after the fleet_tours split it
# owns one surface rather than two: the standalone tour under /tools/ and its
# ledger. Anything belonging to a fleet -- a fleet's own tours, and the ledger
# on a fleet event -- needs fleet_tours on top.
tour_payouts:
  description: "Tour payouts — a shared expense/income ledger with a settlement list, on fleet events and standalone tours"
