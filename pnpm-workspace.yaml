packages:
  - '.'
# The fast path this skips answers "up to date" from a check that never reads
# the lockfile, so an install after a pull could report success in 2ms without
# having looked at what the pull changed.
#
# It does not bring `postinstall` back on a repeat install - pnpm skips the
# build phase either way once node_modules matches. What keeps the generated
# API and cable clients current is bin/generate-clients, which Vite and
# `lint:ts` run themselves.
optimisticRepeatInstall: false
allowBuilds:
  '@hyperjump/json-pointer': false
  '@hyperjump/json-schema': false
  '@hyperjump/json-schema-core': false
  '@hyperjump/pact': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  core-js: false
  esbuild: true
  msw: false
  vue-demi: false
peerDependencyRules:
  allowedVersions:
    vite-plugin-pwa>vite: '8'
overrides:
  json5: '>=2.2.2'
  semver: '>=7.5.2'
  picomatch: '>=4.0.4'
  serialize-javascript: '>=7.0.5'
  ajv@5: '>=6.14.0 <7'
  ajv@6: '>=6.14.0 <7'
  jsonpath-plus@7: '>=10.3.0'
  js-yaml@4: '>=4.3.2 <5'
patchedDependencies:
  '@tresjs/core@5.8.1': patches/@tresjs__core@5.8.1.patch
minimumReleaseAgeExclude:
  - asyncapi-cable@0.3.0
